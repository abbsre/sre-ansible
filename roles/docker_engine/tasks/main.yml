---
- name: Validate supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - ansible_distribution in ['Ubuntu', 'Debian']
    fail_msg: "docker_engine currently supports only Ubuntu and Debian hosts."

- name: Install Docker apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_repo_base_url }}/{{ ansible_distribution | lower }}/gpg"
    dest: "{{ docker_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch_map.get(ansible_architecture, ansible_architecture) }}
      signed-by={{ docker_apt_key_path }}]
      {{ docker_apt_repo_base_url }}/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Read local users before granting Docker access
  ansible.builtin.getent:
    database: passwd
  when:
    - docker_add_bootstrap_admins_to_group
    - bootstrap_admin_users | default([]) | length > 0

- name: Add bootstrap admin users to docker group
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: docker
    append: true
  loop: "{{ bootstrap_admin_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - docker_add_bootstrap_admins_to_group
    - bootstrap_admin_users | default([]) | length > 0
    - item.name in ansible_facts.getent_passwd
